    <main class="registro_main">
        <h1>Formulario de registro Conquer Academy</h1>
        <form action="procesar_registro.php" method="post">
            <div class="campo">
                <label for="nombre">Nombe Completo</label>
                <input type="text" id="nombre" name="nombre" required autofocus>
            </div>
            <div class="campo">
                <label for="fecha">Fecha de nacimiento</label>
                <input type="date" id="fecha" name="fecha" required>
            </div>
            <div class="campo">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="campo">
                 <label for="direccion">Dirección:</label>
                <input type="text" id="direccion" name="direccion" required>

            </div>
            <div class="campo">
                <label for="web">Página Web:</label>
                <input type="text" id="web" name="web" required>
            </div>
            <div class="campo">
                <label for="foto">Foto:</label>
                <input type="file" id="foto" name="foto" accept="image/*" required>
            </div>
            <div class="campo__bio">
                 <label for="biografia">Biogrfía</label>
                <textarea name="biogafia" id="biografia" cols="10" rows="10"></textarea>
            </div>

            <button>Enviar Formulario</button>
        </form>
